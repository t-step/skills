name: checks

# Backstop only: this repository is private and verification is local-first
# (AGENTS.md) — scripts/check.sh must already have passed locally before a
# PR is opened. CI re-runs the identical script so nothing merges on a
# machine-local oversight.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash scripts/check.sh
